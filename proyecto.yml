apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: industrialfleets
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cGFzc3dvcmQ=
  MYSQL_USER: dXN1YXJpbw==
  MYSQL_PASSWORD: cGFzc3dvcmQ=
  MYSQL_DATABASE: aW5kdXN0cmlhbGZsZWV0cw==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-config
  namespace: industrialfleets
data:
  DB_HOST: mariadb
  DB_PORT: "3306"
  PYTHONBUFFERED: "1"
  CONNECTION_TRIES: "5"
  EXPIRATION_MINUTES: "30"
  SECRET_KEY: "clave_secreta"
  PAGE_SIZE: "10"
  MAX_IMAGE_SIZE: "1048576"
  DEBUG: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: industrialfleets
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apache-logs-pvc
  namespace: industrialfleets
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastapi-logs-pvc
  namespace: industrialfleets
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: industrialfleets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: recarte/industrialfleets_mariadb:latest
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: industrialfleets
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: industrialfleets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: recarte/industrialfleets_fastapi:latest
          envFrom:
            - configMapRef:
                name: fastapi-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: fastapi-logs
              mountPath: /var/log/api
      volumes:
        - name: fastapi-logs
          persistentVolumeClaim:
            claimName: fastapi-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: industrialfleets
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: industrialfleets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: recarte/industrialfleets_apache:latest
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: apache-logs
              mountPath: /var/log/apache2
      volumes:
        - name: apache-logs
          persistentVolumeClaim:
            claimName: apache-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: industrialfleets
spec:
  type: NodePort
  selector:
    app: apache
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: industrialfleets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin/phpmyadmin:latest
          env:
            - name: PMA_HOST
              value: mariadb
            - name: PMA_PORT
              value: "3306"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: industrialfleets
spec:
  type: NodePort
  selector:
    app: phpmyadmin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---